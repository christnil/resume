name: build and deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production site
        run: npm run verify

      - name: Upload verified site
        uses: actions/upload-artifact@v4
        with:
          name: deployment
          path: dist
          if-no-files-found: error
          retention-days: 1

  pdf:
    needs: site
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download verified site
        uses: actions/download-artifact@v4
        with:
          name: deployment
          path: dist

      - name: Generate PDFs from the pinned offline TeX Live image
        run: |
          node create-tex.mjs --lang=en
          node create-tex.mjs --lang=sv
          ./scripts/generatepdf-ci.sh

      - name: Confirm complete deployment directory
        run: |
          test -f dist/index.html
          test -f dist/sv/index.html
          test -f dist/christoffer-nilsson-en.pdf
          test -f dist/christoffer-nilsson-sv.pdf
          ls -la dist
          ls -la dist/sv

      - name: Upload complete deployment
        uses: actions/upload-artifact@v4
        with:
          name: deployment-with-pdfs
          path: dist
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [site, pdf]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Download complete deployment
        uses: actions/download-artifact@v4
        with:
          name: deployment-with-pdfs
          path: dist

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
